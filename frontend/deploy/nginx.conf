# All Metadata Cleaner — cấu hình Nginx (tự sinh bởi `npm run build` từ src/seo/nginx.ts — đừng sửa tay).
# Cài đặt lần đầu trên VPS (Ubuntu/Debian), tên miền đã trỏ A/AAAA về IP của VPS:
#   1. sudo apt install nginx certbot
#   2. Chép nội dung dist/ lên /var/www/allmetadatacleaner.com
#   3. Chứng chỉ SSL Let's Encrypt cho cả tên miền chính và www (certbot tự dừng/bật Nginx khi lấy và khi gia hạn):
#      sudo certbot certonly --standalone -d allmetadatacleaner.com -d www.allmetadatacleaner.com \
#        --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
#   4. sudo cp deploy/nginx.conf /etc/nginx/sites-available/allmetadatacleaner.com
#      sudo ln -s /etc/nginx/sites-available/allmetadatacleaner.com /etc/nginx/sites-enabled/
#      sudo rm -f /etc/nginx/sites-enabled/default
#   5. sudo nginx -t && sudo systemctl reload nginx
# Các lần cập nhật sau: chỉ cần chép lại dist/ (và nginx.conf nếu thay đổi rồi reload).
# Yêu cầu Nginx >= 1.25.1 (cú pháp "http2 on;"). Bản cũ hơn: xóa dòng "http2 on;" và dùng "listen 443 ssl http2;".

# ---------- Chọn ngôn ngữ cho trang gốc "/" ----------

# 1. Lựa chọn đã lưu (cookie "lang", đặt khi người dùng tự đổi ngôn ngữ).
map $cookie_lang $lang_saved {
    default "";
    "~*^en$"                                    en;
    "~*^ja$"                                    ja;
    "~*^es$"                                    es;
    "~*^de$"                                    de;
    "~*^fr$"                                    fr;
    "~*^pt-BR$"                                 pt-br;
    "~*^it$"                                    it;
    "~*^zh-CN$"                                 zh-cn;
    "~*^ar$"                                    ar;
    "~*^hi$"                                    hi;
    "~*^id$"                                    id;
    "~*^ko$"                                    ko;
    "~*^nl$"                                    nl;
    "~*^pl$"                                    pl;
    "~*^ru$"                                    ru;
    "~*^sv$"                                    sv;
    "~*^th$"                                    th;
    "~*^tr$"                                    tr;
    "~*^vi$"                                    vi;
    "~*^zh-TW$"                                 zh-tw;
    "~*^uk$"                                    uk;
    "~*^he$"                                    he;
    "~*^cs$"                                    cs;
    "~*^fi$"                                    fi;
    "~*^sk$"                                    sk;
    "~*^ca$"                                    ca;
    "~*^hr$"                                    hr;
    "~*^da$"                                    da;
    "~*^hu$"                                    hu;
    "~*^pt-PT$"                                 pt-pt;
    "~*^el$"                                    el;
    "~*^ro$"                                    ro;
}

# 2. Ngôn ngữ đầu tiên của trình duyệt (Accept-Language).
map $http_accept_language $lang_browser {
    default "";
    "~*^\s*zh-(?:hant|tw|hk|mo)"                zh-tw;
    "~*^\s*zh(?:[-_;,\s]|$)"                    zh-cn;
    "~*^\s*pt-pt(?:[-_;,\s]|$)"                 pt-pt;
    "~*^\s*pt(?:[-_;,\s]|$)"                    pt-br;
    "~*^\s*iw(?:[-_;,\s]|$)"                    he;
    "~*^\s*in(?:[-_;,\s]|$)"                    id;
    "~*^\s*en(?:[-_;,\s]|$)"                    en;
    "~*^\s*ja(?:[-_;,\s]|$)"                    ja;
    "~*^\s*es(?:[-_;,\s]|$)"                    es;
    "~*^\s*de(?:[-_;,\s]|$)"                    de;
    "~*^\s*fr(?:[-_;,\s]|$)"                    fr;
    "~*^\s*it(?:[-_;,\s]|$)"                    it;
    "~*^\s*ar(?:[-_;,\s]|$)"                    ar;
    "~*^\s*hi(?:[-_;,\s]|$)"                    hi;
    "~*^\s*id(?:[-_;,\s]|$)"                    id;
    "~*^\s*ko(?:[-_;,\s]|$)"                    ko;
    "~*^\s*nl(?:[-_;,\s]|$)"                    nl;
    "~*^\s*pl(?:[-_;,\s]|$)"                    pl;
    "~*^\s*ru(?:[-_;,\s]|$)"                    ru;
    "~*^\s*sv(?:[-_;,\s]|$)"                    sv;
    "~*^\s*th(?:[-_;,\s]|$)"                    th;
    "~*^\s*tr(?:[-_;,\s]|$)"                    tr;
    "~*^\s*vi(?:[-_;,\s]|$)"                    vi;
    "~*^\s*uk(?:[-_;,\s]|$)"                    uk;
    "~*^\s*he(?:[-_;,\s]|$)"                    he;
    "~*^\s*cs(?:[-_;,\s]|$)"                    cs;
    "~*^\s*fi(?:[-_;,\s]|$)"                    fi;
    "~*^\s*sk(?:[-_;,\s]|$)"                    sk;
    "~*^\s*ca(?:[-_;,\s]|$)"                    ca;
    "~*^\s*hr(?:[-_;,\s]|$)"                    hr;
    "~*^\s*da(?:[-_;,\s]|$)"                    da;
    "~*^\s*hu(?:[-_;,\s]|$)"                    hu;
    "~*^\s*el(?:[-_;,\s]|$)"                    el;
    "~*^\s*ro(?:[-_;,\s]|$)"                    ro;
}

# 3. Quốc gia theo IP. Mặc định tắt (VPS không có sẵn thông tin quốc gia). Để bật: cài module GeoIP2
#    (libnginx-mod-http-geoip2 + cơ sở dữ liệu GeoLite2-Country) rồi thay khối map dưới đây bằng:
#      geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb { $country_code country iso_code; }
map $remote_addr $country_code {
    default "";
}
map $country_code $lang_country {
    default "";
    VN vi;
    JP ja;
    KR ko;
    CN zh-cn;
    TW zh-tw;
    HK zh-tw;
    MO zh-tw;
    TH th;
    ID id;
    ES es;
    MX es;
    AR es;
    CO es;
    CL es;
    PE es;
    VE es;
    EC es;
    GT es;
    CU es;
    BO es;
    DO es;
    HN es;
    PY es;
    SV es;
    NI es;
    CR es;
    PA es;
    UY es;
    DE de;
    AT de;
    LI de;
    FR fr;
    MC fr;
    IT it;
    SM it;
    BR pt-br;
    PT pt-pt;
    AO pt-pt;
    MZ pt-pt;
    NL nl;
    PL pl;
    RU ru;
    BY ru;
    KZ ru;
